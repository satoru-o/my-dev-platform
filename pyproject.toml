[project]
name = "my-dev-platform"
version = "0.0.0"
description = "個人ラボ: AI駆動開発フロー（TDD x スペック駆動）の実験場"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx2",  # FastAPI TestClient 用（Starletteがhttpxではなくhttpx2を案内）
    "ruff",
    "pyright",
    "pip-audit>=2.10.1",
    "detect-secrets>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/hooks"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I: 基本、B: バグの元、S: セキュリティ（bandit系）
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # テストでのassertは許可
".claude/hooks/**" = ["E501", "S101", "S603"]  # hookのガードとそのテスト（長い正規表現、assert、subprocess）

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

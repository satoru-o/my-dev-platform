[project]
name = "my-dev-platform"
version = "0.0.0"
description = "個人ラボ: AI駆動開発フロー（TDD x スペック駆動）の実験場"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx",  # FastAPI TestClient 用
    "ruff",
    "pyright",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I: 基本、B: バグの元、S: セキュリティ（bandit系）
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # テストでのassertは許可

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

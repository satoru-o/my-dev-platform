[project]
name = "my-dev-platform"
version = "0.0.0"
description = "個人ラボ: AI駆動開発フロー（TDD x スペック駆動）の実験場"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "httpx2",  # FastAPI TestClient 用（Starletteがhttpxではなくhttpx2を案内）
    "ruff",
    "pyright",
    "pip-audit>=2.10.1",
    "detect-secrets>=1.5.0",
    "mutmut>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", ".claude/hooks"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I: 基本、B: バグの元、S: セキュリティ（bandit系）
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603", "S607"]  # テストでの assert と、一時リポジトリで git を呼ぶ処理は許可
".claude/hooks/**" = ["E501", "S101", "S603"]  # hookのガードとそのテスト（長い正規表現、assert、subprocess）

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", ".claude/hooks"]  # base_compare が guardlib（hookの比較の関数）を使うため。extraPaths を書くと src の自動検出が消えるので src も書く
typeCheckingMode = "standard"

[tool.mutmut]
# 実験用。mutation testing は常設せず、1機能に1回だけ回す（docs/experiments/ に結果を残す）
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]

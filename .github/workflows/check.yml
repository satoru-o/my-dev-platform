# push時に `make check` を回すだけ。検査の中身は Makefile に置く（ここに書かない）。
# 外部の action は、コミットSHAで固定する（コメントはタグ）。
name: check

on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # あとで origin/main との比較を足すため、履歴を全部取る
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: make check
